 purchased, activated, scheduled, reserved, published, commenced, or otherwise processed, the payment is generally non-refundable. Where an eligible cancellation or refund-related adjustment is approved, GOLO's standard remedy is the issuance of a **Credit Note** by NexaPrime Pvt. Ltd., rather than a monetary refund.\n\nA monetary refund will only be provided where:\n1. It is required by applicable law.\n2. A transaction has been incorrectly or fraudulently processed and a monetary reversal is legally or operationally required.\n3. GOLO is unable to provide a paid service and a monetary refund is required by applicable law.\n4. NexaPrime is otherwise legally required to return the amount.", "category": "Refund & Credit Note FAQ", "tags": ["cash", "credit", "monetary", "note", "provide", "refund", "refund & credit note faq", "refunds"]}, {"id": 116, "question": "What is a Credit Note?", "answer": "A Credit Note is a formal credit document issued by NexaPrime Pvt. Ltd. to an eligible User or Merchant following an approved cancellation, refund-related adjustment, service failure, or other qualifying circumstance. It represents an amount that may be adjusted against eligible future GOLO services. A Credit Note is **not** a bank balance, deposit, or GOLO Wallet balance.", "category": "Refund & Credit Note FAQ", "tags": ["credit", "note", "refund", "refund & credit note faq"]}, {"id": 117, "question": "How do I request a refund or Credit Note?", "answer": "1. Contact GOLO through the **Help Center** or **Merchant Support**.\n2. Provide your GOLO account information, Transaction ID or payment reference, service details, date of purchase, amount paid, reason for cancellation, and any supporting information.\n3. GOLO will review your request based on the applicable circumstances.\n4. Submitting a request **does not guarantee** approval.", "category": "Refund & Credit Note FAQ", "tags": ["credit", "note", "refund", "refund & credit note faq", "request"]}, {"id": 118, "question": "How is the Credit Note amount calculated for advertising cancellations?", "answer": "For eligible advertising and promotional services charged based on a defined period, GOLO calculates the Eligible Amount using:\n\n$$\\text{Eligible Credit Amount} = \\text{Unutilized Days} \\times \\text{Daily Ad Rate}$$\n\n*Example:*\n- Advertising period = 30 days\n- Total service price = \u20b93,000\n- Daily Ad Rate = \u20b9100\n- Unutilized period = 10 days\n- **Eligible Credit Amount = $10 \\times \u20b9100 = \u20b91,000$**\n\nSubject to the applicable terms, NexaPrime may issue a \u20b91,000 Credit Note.", "category": "Refund & Credit Note FAQ", "tags": ["advertising", "amount", "calculated", "cancellations", "credit", "note", "refund", "refund & credit note faq"]}, {"id": 119, "question": "Can I get a Credit Note for a service that has already been utilized?", "answer": "No. No automatic Credit Note will be issued for services that have already been fully consumed or materially delivered. This includes advertisements that have been published, displayed, delivered to users, completed their scheduled period, received promotional placement, or been substantially utilized.", "category": "Refund & Credit Note FAQ", "tags": ["already", "been", "credit", "get", "has", "note", "refund", "refund & credit note faq", "service", "utilized"]}, {"id": 120, "question": "How can I use a Credit Note?", "answer": "A Credit Note can be applied toward eligible future GOLO services including:\n- Customer advertising\n- Merchant advertising\n- Banner advertising\n- Product promotion\n- Service promotion\n- Featured promotional services\n- Other eligible paid GOLO services approved by NexaPrime\n\nThe value of the Credit Note will be adjusted against the applicable purchase amount during checkout.", "category": "Refund & Credit Note FAQ", "tags": ["credit", "note", "refund", "refund & credit note faq", "use"]}, {"id": 121, "question": "What if the future service costs more than my Credit Note balance?", "answer": "If the value of a future GOLO service exceeds the available Credit Note value, you pay the remaining balance through any supported payment method (UPI, Debit/Credit Card, Net Banking).", "category": "Refund & Credit Note FAQ", "tags": ["balance", "costs", "credit", "future", "more", "note", "refund", "refund & credit note faq", "service", "than"]}, {"id": 122, "question": "What if the future service costs less than my Credit Note balance?", "answer": "If the service costs less than the available Credit Note value, only the applicable service amount will be adjusted. The remaining value continues to be available for future eligible GOLO services, subject to the Credit Note's terms and validity.", "category": "Refund & Credit Note FAQ", "tags": ["balance", "costs", "credit", "future", "less", "note", "refund", "refund & credit note faq", "service", "than"]}, {"id": 123, "question": "Can I convert a Credit Note to cash or withdraw it to my bank?", "answer": "No. Unless required by applicable law, a Credit Note **cannot** be:\n- Redeemed for cash.\n- Withdrawn to a bank account.\n- Transferred to a UPI account.\n- Refunded to a credit or debit card.\n- Converted into cash through payment gateways.\n- Otherwise exchanged for monetary payment.", "category": "Refund & Credit Note FAQ", "tags": ["bank", "cash", "convert", "credit", "note", "refund", "refund & credit note faq", "withdraw"]}, {"id": 124, "question": "Can I transfer a Credit Note to another user?", "answer": "No. Unless expressly permitted by NexaPrime, Credit Notes are strictly associated with the specific User or Merchant for whom they were issued and cannot be sold, transferred, or assigned to another account.", "category": "Refund & Credit Note FAQ", "tags": ["another", "credit", "note", "refund", "refund & credit note faq", "transfer", "user"]}, {"id": 125, "question": "Are merchant subscription fees refundable?", "answer": "Merchant subscription fees are **generally non-refundable**, including where a Merchant terminates or cancels their account during an active subscription period. No automatic prorated refund or Credit Note will be provided for unused subscription time.", "category": "Refund & Credit Note FAQ", "tags": ["credit", "fees", "merchant", "note", "refund", "refund & credit note faq", "refundable", "subscription"]}, {"id": 126, "question": "How long does a refund or Credit Note review take?", "answer": "GOLO reviews requests based on service usage, publication records, and transaction logs. In the rare event an approved monetary refund is authorized, it is processed through the payment gateway back to the original payment source within **5 to 7 business days**.\n\n---", "category": "Refund & Credit Note FAQ", "tags": ["credit", "long", "note", "refund", "refund & credit note faq", "review", "take"]}, {"id": 127, "question": "What is the GOLO Wallet?", "answer": "The GOLO Wallet is an internal digital balance system available to both customers (Customer Wallet) and merchants (Store Wallet). It stores credits that are automatically generated when paid services (such as banner promotions or advertisements) are cancelled and a portion of the funds remain unutilized. The wallet balance can be used seamlessly during checkout when purchasing future GOLO services.", "category": "Wallet/Coupon FAQ", "tags": ["wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 128, "question": "How do I access my GOLO Wallet?", "answer": "- **Customers:** Navigate to **Profile** \u2192 **Wallet**. You will see your Available Balance and full Transaction History.\n- **Merchants:** Navigate to the **Store Wallet** from the Merchant Dashboard. You will see your Available Balance, Total Transactions, and a detailed Transaction History table.", "category": "Wallet/Coupon FAQ", "tags": ["access", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 129, "question": "How does money get added to my wallet?", "answer": "Wallet credits are automatically added when:\n- You cancel a banner promotion and leftover unutilized funds are credited.\n- You cancel an advertisement and the eligible unused portion is credited.\n- A refund-related adjustment is processed as a wallet credit.\n- Other Credit Note or refund-related resolutions result in a wallet credit.\n\nYou **cannot** manually top up your wallet with external funds. The wallet is funded exclusively through platform-generated credits.", "category": "Wallet/Coupon FAQ", "tags": ["added", "get", "money", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 130, "question": "What can I use my GOLO Wallet balance for?", "answer": "Your wallet balance can be used to pay for eligible future GOLO services during checkout, including:\n- Banner advertisement uploads and promotions.\n- Customer and merchant ad posting fees.\n- Product and service promotion campaigns.\n- Subscription payments (for merchants).\n- Other paid GOLO services.", "category": "Wallet/Coupon FAQ", "tags": ["balance", "use", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 131, "question": "Can I withdraw my wallet balance as cash?", "answer": "No. The GOLO Wallet balance is **not** redeemable for cash, cannot be withdrawn to a bank account, transferred to UPI, or refunded to a card. It is intended exclusively for use toward eligible GOLO services. The wallet balance is not a bank deposit, electronic money, or a transferable monetary instrument.", "category": "Wallet/Coupon FAQ", "tags": ["balance", "cash", "wallet", "wallet/coupon", "wallet/coupon faq", "withdraw"]}, {"id": 132, "question": "What types of wallet transactions exist?", "answer": "Wallet transactions are categorized as:\n- **Credit:** Funds added to your wallet (e.g., refund from a cancelled banner, ad cancellation credit).\n- **Debit:** Funds used from your wallet toward a GOLO service purchase.\n\nEach transaction records the amount, description, reference category (banner, ad, subscription, or other), status (completed, pending, failed), and timestamp.", "category": "Wallet/Coupon FAQ", "tags": ["exist", "transactions", "types", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 133, "question": "Can I view my wallet transaction history?", "answer": "Yes. Both the Customer Wallet page and the Merchant Store Wallet page display a complete, chronologically ordered Transaction History showing each credit and debit transaction with amounts, descriptions, and dates.", "category": "Wallet/Coupon FAQ", "tags": ["history", "transaction", "view", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 134, "question": "Is the GOLO Wallet the same as a Credit Note?", "answer": "No. As per GOLO's Refund & Credit Note Policy, a Credit Note is a formal credit document issued by NexaPrime and is separate from any wallet or digital credit system. The GOLO Wallet is an operational balance for quick service payments, while a Credit Note is a formal accounting instrument.", "category": "Wallet/Coupon FAQ", "tags": ["credit", "note", "same", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 135, "question": "What are GOLO coupons?", "answer": "GOLO coupons are promotional discount codes issued by the platform or specific merchants to provide discounts on paid GOLO services. Coupons may offer percentage discounts, flat price reductions, or category-specific promotional benefits.", "category": "Wallet/Coupon FAQ", "tags": ["coupons", "wallet/coupon", "wallet/coupon faq"]}, {"id": 136, "question": "How do I apply a coupon on GOLO?", "answer": "During the checkout process for a paid GOLO service, enter the coupon code in the designated promo code field and click **Apply**. If valid, the discount is immediately deducted from your order total before payment.", "category": "Wallet/Coupon FAQ", "tags": ["apply", "coupon", "wallet/coupon", "wallet/coupon faq"]}, {"id": 137, "question": "Why is my coupon not working?", "answer": "A coupon may not work due to:\n- The coupon code has **expired**.\n- The total order value is below the **minimum spend** requirement.\n- The coupon has already reached its **usage limit**.\n- The coupon is **restricted** to specific categories or first-time users.\n- The coupon code was entered with a typo (codes are case-sensitive).", "category": "Wallet/Coupon FAQ", "tags": ["coupon", "not", "wallet/coupon", "wallet/coupon faq", "working"]}, {"id": 138, "question": "Can I combine a coupon with my wallet balance?", "answer": "Yes. During checkout, you can apply a valid coupon code to reduce your order total, and then use your GOLO Wallet balance to pay part or all of the remaining amount.\n\n---", "category": "Wallet/Coupon FAQ", "tags": ["balance", "combine", "coupon", "wallet", "wallet/coupon", "wallet/coupon faq"]}, {"id": 139, "question": "Does GOLO offer merchant subscriptions?", "answer": "Yes. GOLO provides structured subscription plans for merchants to scale their store visibility, unlock higher product catalog listing quotas, launch concurrent active deals, and access advanced demographic and revenue analytics.", "category": "Subscription FAQ", "tags": ["merchant", "offer", "subscription", "subscription faq", "subscriptions"]}, {"id": 140, "question": "What is included in a GOLO merchant subscription?", "answer": "Key features across plan tiers include:\n- **Product Inventory Quota:** Increased maximum product listings (e.g., 20 products on basic tiers up to unlimited on enterprise tiers).\n- **Active Offers Quota:** Higher number of concurrent active deals and longer campaign durations.\n- **Banner Promotion Credits:** Monthly credits for homepage and category banner placements.\n- **Advanced Analytics:** In-depth customer demographic reports (age, gender, location heatmaps, device breakdown, revenue charts).\n- **Search Priority:** Boosted ranking in search results and nearby deal feeds.\n- **Custom Digital Storefront:** Dedicated public merchant store webpage.", "category": "Subscription FAQ", "tags": ["included", "merchant", "subscription", "subscription faq"]}, {"id": 141, "question": "How can a merchant subscribe or upgrade?", "answer": "1. In the Merchant Dashboard, go to **Upgrade Plan**.\n2. Compare available plans (Trial, Standard, Premium, Enterprise).\n3. Select your billing cycle (Monthly or Yearly) and proceed to **Checkout**.\n4. Complete the payment through Razorpay to activate your subscription instantly.", "category": "Subscription FAQ", "tags": ["merchant", "subscribe", "subscription", "subscription faq", "upgrade"]}, {"id": 142, "question": "How much does a subscription cost?", "answer": "GOLO offers competitive pricing starting with a **Free / Trial Plan (\u20b90)** for new merchants, up to cost-effective **Standard and Premium tiers**. Exact current pricing and billing options are displayed on the Upgrade Plan page.", "category": "Subscription FAQ", "tags": ["cost", "much", "subscription", "subscription faq"]}, {"id": 143, "question": "How long is a subscription valid?", "answer": "- **Monthly Plan:** Valid for 30 calendar days from purchase.\n- **Yearly Plan:** Valid for 365 calendar days from purchase.\n- **Trial Plan:** Valid for the duration of the promotional trial period (e.g., 14 or 30 days).", "category": "Subscription FAQ", "tags": ["long", "subscription", "subscription faq", "valid"]}, {"id": 144, "question": "How can I cancel my subscription?", "answer": "Navigate to **Merchant Settings** \u2192 **Subscription Details** and select **Cancel Subscription** or turn off auto-renewal. Your subscription features will remain active until the end of your current billing cycle.", "category": "Subscription FAQ", "tags": ["cancel", "subscription", "subscription faq"]}, {"id": 145, "question": "Will my subscription automatically renew?", "answer": "Auto-renewal settings can be toggled On or Off in your merchant subscription preferences according to your selected payment method.", "category": "Subscription FAQ", "tags": ["automatically", "renew", "subscription", "subscription faq", "will"]}, {"id": 146, "question": "Are subscription fees refundable?", "answer": "Subscription fees are **non-refundable** once the billing period has commenced. In the case of accidental duplicate charges or verified payment gateway errors, refund requests can be submitted via the Support Center for review.", "category": "Subscription FAQ", "tags": ["fees", "refundable", "subscription", "subscription faq"]}, {"id": 147, "question": "What happens when my subscription expires?", "answer": "If a subscription expires without renewal, your account automatically transitions to the Free/Basic tier. Your catalog and data are preserved, but premium features (extra active deals, banner credits, advanced analytics) are paused until renewed.", "category": "Subscription FAQ", "tags": ["expires", "happens", "subscription", "subscription faq"]}, {"id": 148, "question": "Can subscription benefits be transferred to another account?", "answer": "No. Subscriptions are non-transferable and remain strictly associated with the specific registered merchant user account and store profile.\n\n---", "category": "Subscription FAQ", "tags": ["account", "another", "benefits", "subscription", "subscription faq", "transferred"]}, {"id": 149, "question": "Why can't I log in to my GOLO account?", "answer": "- Ensure your email and password are typed correctly (passwords are case-sensitive).\n- Verify that your account email was verified with OTP during registration.\n- If you forgot your password, use the \"Forgot Password\" link to reset it.\n- If your account was flagged for a policy violation, contact support for assistance.", "category": "Troubleshooting FAQ", "tags": ["account", "cant", "log", "troubleshooting", "troubleshooting faq"]}, {"id": 150, "question": "What should I do if I forgot my password?", "answer": "Click **\"Forgot Password?\"** on the login screen, enter your registered email address, retrieve the 6-digit OTP from your inbox, verify the code, and set a new password.", "category": "Troubleshooting FAQ", "tags": ["forgot", "password", "should", "troubleshooting", "troubleshooting faq"]}, {"id": 151, "question": "Why am I not receiving the email OTP?", "answer": "- Check your **Spam / Junk / Promotions** folders.\n- Ensure your email address contains no typos or trailing spaces.\n- Wait 60 seconds before clicking **\"Resend OTP\"**.\n- Ensure your mail server is not blocking automated emails from the GOLO domain.", "category": "Troubleshooting FAQ", "tags": ["email", "not", "otp", "receiving", "troubleshooting", "troubleshooting faq"]}, {"id": 152, "question": "Why is the GOLO website or app not loading?", "answer": "- Check your internet connection.\n- Clear your browser cookies and cache or restart the mobile app.\n- Disable aggressive ad-blockers or VPN extensions that may block platform calls.\n- Try accessing the site in an Incognito / Private browsing window.", "category": "Troubleshooting FAQ", "tags": ["app", "loading", "not", "troubleshooting", "troubleshooting faq", "website"]}, {"id": 153, "question": "Why is a product not appearing in search results?", "answer": "- The product may be marked as \"Inactive\" or \"Out of Stock\" by the merchant.\n- The product may be outside your current location filter radius.\n- The item may be newly added and undergoing brief search indexing or admin moderation.", "category": "Troubleshooting FAQ", "tags": ["appearing", "not", "product", "results", "search", "troubleshooting", "troubleshooting faq"]}, {"id": 154, "question": "Why can't I place an order or claim an offer?", "answer": "- Ensure you are logged into an active customer account.\n- Check if your profile has an address and phone number configured.\n- Ensure the offer has not reached its maximum redemption quota or expiration date.", "category": "Troubleshooting FAQ", "tags": ["cant", "claim", "offer", "order", "place", "troubleshooting", "troubleshooting faq"]}, {"id": 155, "question": "Why did my payment fail?", "answer": "Payment failures are usually due to incorrect OTP/CVV entry, insufficient account balance, bank server downtime, or a connection timeout. Try again or select an alternate payment method (UPI, Debit/Credit Card, Net Banking).", "category": "Troubleshooting FAQ", "tags": ["fail", "payment", "troubleshooting", "troubleshooting faq"]}, {"id": 156, "question": "Why is my order status not updating?", "answer": "Order statuses update when the merchant accepts or fulfills the order. Pull down to refresh your order page or contact the merchant directly via GOLO Chat for an update.", "category": "Troubleshooting FAQ", "tags": ["not", "order", "status", "troubleshooting", "troubleshooting faq", "updating"]}, {"id": 157, "question": "Why can't I cancel my claimed offer?", "answer": "Once an offer voucher is scanned and redeemed at the merchant store, it is permanently marked as \"Redeemed\". Unredeemed vouchers can simply be left to expire automatically without any penalty.", "category": "Troubleshooting FAQ", "tags": ["cancel", "cant", "claimed", "offer", "troubleshooting", "troubleshooting faq"]}, {"id": 158, "question": "Why haven't I received my refund?", "answer": "Approved refunds are processed through the payment gateway back to the original payment source. Depending on your bank's processing cycles, refunds typically appear within **5 to 7 business days**.", "category": "Troubleshooting FAQ", "tags": ["havent", "received", "refund", "troubleshooting", "troubleshooting faq"]}, {"id": 159, "question": "Why isn't my coupon working?", "answer": "- The coupon code may have expired.\n- The total order value may be below the required minimum spend.\n- The coupon may have already been used (single-use limit).\n- The coupon may be restricted to specific categories or first-time users.", "category": "Troubleshooting FAQ", "tags": ["coupon", "isnt", "troubleshooting", "troubleshooting faq", "working"]}, {"id": 160, "question": "What should I do if the mobile app crashes?", "answer": "- Force-close and restart the app.\n- Ensure your app is updated to the latest release.\n- Clear app cache storage in your device settings.\n- Restart your mobile device.", "category": "Troubleshooting FAQ", "tags": ["app", "crashes", "mobile", "should", "troubleshooting", "troubleshooting faq"]}, {"id": 161, "question": "What should I do if I encounter an unexpected error?", "answer": "Note down the error message, take a screenshot, refresh the page, and report the issue through the **Help Center** with steps to reproduce the error.", "category": "Troubleshooting FAQ", "tags": ["encounter", "error", "should", "troubleshooting", "troubleshooting faq", "unexpected"]}, {"id": 162, "question": "How can I contact GOLO support for a technical problem?", "answer": "Submit a ticket under the **Help Center**, select the issue type **\"Technical / Bug\"**, attach screenshots and error details, or email the technical team at `support@golo.com`.", "category": "Troubleshooting FAQ", "tags": ["contact", "problem", "support", "technical", "troubleshooting", "troubleshooting faq"]}, {"id": 163, "question": "How do I log out of my GOLO account?", "answer": "To log out of your GOLO account:\n1. Click on your **Profile Avatar / Account Icon** in the top navigation bar.\n2. In the user menu dropdown, select **Log Out** (or **Sign Out**).\n3. Your active authentication session token will be cleared immediately, and you will be securely redirected to the GOLO home page.\n\n*Note:* If you are using a shared or public computer, we also recommend closing your browser window after logging out for added security.", "category": "Account FAQ", "tags": ["logout", "log out", "sign out", "signout", "exit", "session", "sign off", "account", "profile"]}];

        let isDrawerOpen = false;
        let isMaximized = false;
        let isRecording = false;
        let speechRecognizer = null;
        let typingDebounceTimer = null;
        let activeTheme = localStorage.getItem('golo_theme') || 'light'; // DEFAULT LIGHT MODE

        // DOM Elements
        const drawer = document.getElementById('chatAssistantDrawer');
        const minibar = document.getElementById('minibarDock');
        const stream = document.getElementById('chatMessageStream');
        const inputField = document.getElementById('userQueryInputField');
        const btnSend = document.getElementById('btnSendQuery');
        const btnMic = document.getElementById('btnMicRecord');
        const voiceBar = document.getElementById('voiceFeedbackBar');
        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const btnMaxToggle = document.getElementById('btnMaxToggle');
        const robotStatusBadge = document.getElementById('robotStatusBadge');
        const robotStatusText = document.getElementById('robotStatusText');
        const robotPulseDot = document.getElementById('robotPulseDot');

        // All Robot Mascot Containers
        const robotElements = [
            document.getElementById('headerRobot'),
            document.getElementById('floatRobot')
        ];

        /* ==========================================================================
           ROBOT STATE CONTROLLER
           States: 'idle', 'typing', 'processing', 'happy', 'error'
           ========================================================================== */
        function setRobotState(state, customText = null) {
            robotElements.forEach(el => {
                if (!el) return;
                el.classList.remove('state-idle', 'state-typing', 'state-processing', 'state-happy', 'state-error');
                el.classList.add(`state-${state}`);
            });

            // Also update greeting robot if present
            const welcomeRobot = document.getElementById('welcomeMascotRobot');
            if (welcomeRobot) {
                welcomeRobot.classList.remove('state-idle', 'state-typing', 'state-processing', 'state-happy', 'state-error');
                welcomeRobot.classList.add(`state-${state}`);
            }

            // Update Header Status Badge
            if (robotStatusText && robotPulseDot) {
                switch(state) {
                    case 'typing':
                        robotStatusText.innerText = customText || 'Typing on keyboard...';
                        robotPulseDot.style.background = '#38BDF8';
                        robotPulseDot.style.boxShadow = '0 0 6px #38BDF8';
                        break;
                    case 'processing':
                        robotStatusText.innerText = customText || 'Thinking & processing...';
                        robotPulseDot.style.background = '#F5B849';
                        robotPulseDot.style.boxShadow = '0 0 8px #F5B849';
                        break;
                    case 'happy':
                        robotStatusText.innerText = customText || 'Guidance ready! 😊';
                        robotPulseDot.style.background = '#10B981';
                        robotPulseDot.style.boxShadow = '0 0 8px #10B981';
                        break;
                    case 'error':
                        robotStatusText.innerText = customText || 'Not app related';
                        robotPulseDot.style.background = '#EF4444';
                        robotPulseDot.style.boxShadow = '0 0 8px #EF4444';
                        break;
                    case 'idle':
                    default:
                        robotStatusText.innerText = customText || 'Ready to assist';
                        robotPulseDot.style.background = '#10B981';
                        robotPulseDot.style.boxShadow = '0 0 6px #10B981';
                        break;
                }
            }
        }

        // Listen for typing events to trigger the typing animation
        function handleUserTypingEvent() {
            setRobotState('typing');
            clearTimeout(typingDebounceTimer);
            typingDebounceTimer = setTimeout(() => {
                setRobotState('idle');
            }, 1200);
        }

        inputField.addEventListener('input', () => {
            btnSend.disabled = inputField.value.trim().length === 0;
            handleUserTypingEvent();
        });

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                dispatchUserQuery();
            }
        });

        // Theme Initialization (Default Light)
        function initThemeSettings() {
            setThemeMode(activeTheme);
        }

        function setThemeMode(mode) {
            activeTheme = mode;
            document.documentElement.setAttribute('data-theme', mode);
            localStorage.setItem('golo_theme', mode);
            if (btnThemeToggle) {
                btnThemeToggle.innerText = mode === 'light' ? '🌙' : '☀️';
            }
        }

        function toggleTheme() {
            const next = activeTheme === 'light' ? 'dark' : 'light';
            setThemeMode(next);
        }

        // Assistant Modal Controls
        function openAssistantModal() {
            isDrawerOpen = true;
            drawer.classList.add('open');
            minibar.classList.remove('visible');
            if (stream.children.length === 0) {
                renderInitialGreeting();
            }
            setTimeout(() => inputField.focus(), 150);
            scrollMessagesBottom();
        }

        function closeAssistantModal() {
            isDrawerOpen = false;
            drawer.classList.remove('open');
            minibar.classList.remove('visible');
            setRobotState('idle');
        }

        function minimizeAssistantModal() {
            isDrawerOpen = false;
            drawer.classList.remove('open');
            minibar.classList.add('visible');
        }

        function toggleAssistantModal() {
            if (isDrawerOpen) closeAssistantModal();
            else openAssistantModal();
        }

        function toggleMaximizeDrawer() {
            isMaximized = !isMaximized;
            if (isMaximized) {
                drawer.classList.add('maximized');
                btnMaxToggle.innerText = '❐';
            } else {
                drawer.classList.remove('maximized');
                btnMaxToggle.innerText = '⛶';
            }
            scrollMessagesBottom();
        }

        function askQuestion(q) {
            openAssistantModal();
            inputField.value = q;
            btnSend.disabled = false;
            dispatchUserQuery();
        }

        // Web Speech API Voice Recording Feature
        function initSpeechEngine() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechRecognizer = new SpeechClass();
                speechRecognizer.continuous = false;
                speechRecognizer.interimResults = true;
                speechRecognizer.lang = 'en-US';

                speechRecognizer.onstart = () => {
                    isRecording = true;
                    btnMic.classList.add('recording-active');
                    voiceBar.style.display = 'block';
                    setRobotState('typing', 'Listening to voice...');
                };

                speechRecognizer.onresult = (e) => {
                    let transcript = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        transcript += e.results[i][0].transcript;
                    }
                    inputField.value = transcript;
                    btnSend.disabled = transcript.trim().length === 0;
                    handleUserTypingEvent();
                };

                speechRecognizer.onerror = () => stopSpeech();
                speechRecognizer.onend = () => stopSpeech();
            }
        }

        function toggleVoiceRecording() {
            if (!speechRecognizer) initSpeechEngine();
            if (!speechRecognizer) {
                alert('Speech recognition is not supported on this browser. Please type your query.');
                return;
            }
            if (isRecording) {
                speechRecognizer.stop();
                stopSpeech();
            } else {
                speechRecognizer.start();
            }
        }

        function stopSpeech() {
            isRecording = false;
            btnMic.classList.remove('recording-active');
            voiceBar.style.display = 'none';
            setRobotState('idle');
        }

        // Render Initial Welcome Card with Animated Golo Robot & Quick Suggestion Chips
        function renderInitialGreeting() {
            const card = document.createElement('div');
            card.className = 'welcome-robot-card';
            card.innerHTML = `
                <div class="welcome-robot-figure golo-robot-container state-idle" id="welcomeMascotRobot">
                    <svg viewBox="0 0 100 100" class="golo-robot-svg">
    <!-- Processing Neural Halo (Appears when processing) -->

            `;
            stream.appendChild(card);

            const chipsDiv = document.createElement('div');
            chipsDiv.className = 'drawer-chips-group';

            const quickFaqs = [
                "How do I log out of my GOLO account?",
                "What is GOLO and how does it work?",
                "How do I claim an offer voucher?",
                "What is a Credit Note?",
                "How does KYC verification work?",
                "How to register as a merchant?"
            ];

            quickFaqs.forEach(q => {
                const chip = document.createElement('button');
                chip.className = 'drawer-chip';
                chip.innerHTML = `<span>💬</span> ${q}`;
                chip.onclick = () => {
                    askQuestion(q);
                };
                chipsDiv.appendChild(chip);
            });

            stream.appendChild(chipsDiv);
            scrollMessagesBottom();
        }

        function appendMessage(sender, text, source = null) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            let badgeHtml = '';
            if (source && sender === 'ai') {
                badgeHtml = `<span class="ai-source-badge">⚡ ${source}</span>`;
            }

            row.innerHTML = `
                ${badgeHtml}
                <div class="msg-bubble-box">${formatted}</div>
            `;
            stream.appendChild(row);
            scrollMessagesBottom();
        }

        function scrollMessagesBottom() {
            setTimeout(() => {
                stream.scrollTop = stream.scrollHeight;
            }, 50);
        }

        // Dual-Path Query Dispatcher: Live FastAPI RAG Backend -> Client Fallback Engine
        async function dispatchUserQuery() {
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage('user', query);
            inputField.value = '';
            btnSend.disabled = true;

            // Trigger PROCESSING animation on robot
            setRobotState('processing', 'Analyzing query...');

            const session_id = sessionStorage.getItem('golo_session_id') || ('sess_' + Math.random().toString(36).substring(2, 9));
            sessionStorage.setItem('golo_session_id', session_id);
            const merchant_id = localStorage.getItem('golo_merchant_id') || 'MRC-DEMO';

            // 1. Try Live FastAPI Server with RAG Engine
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const res = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id, merchant_id }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    appendMessage('ai', data.response, data.category || 'Golo AI');
                    
                    // Check if response was out-of-scope refusal
                    if (data.source === 'out_of_scope') {
                        setRobotState('error', 'Not app related');
                        setTimeout(() => setRobotState('idle'), 3500);
                    } else {
                        setRobotState('happy', 'Here is your guidance! 😊');
                        setTimeout(() => setRobotState('idle'), 3500);
                    }
                    return;
                }
            } catch (err) {
                // Server unavailable or timeout, fallback to Client RAG Engine
            }

            // 2. Embedded Client-Side Engine (Semantic match across 163 FAQs)
            setTimeout(() => {
                const clientRes = matchClientFaq(query);
                appendMessage('ai', clientRes.answer, clientRes.source);
                
                if (clientRes.isError) {
                    setRobotState('error', 'Not app related');
                } else {
                    setRobotState('happy', 'Here is your guidance! 😊');
                }
                setTimeout(() => setRobotState('idle'), 3500);
            }, 400);
        }

        function matchClientFaq(query) {
            const qLower = query.toLowerCase().trim();

            // Strict Out-of-Scope check
            const outOfScopeTerms = ['cricket', 'football', 'world cup', 'weather', 'recipe', 'movie', 'president', 'sing a song', 'joke', 'python code'];
            if (outOfScopeTerms.some(t => qLower.includes(t)) && !qLower.includes('golo')) {
                return {
                    answer: "It is not our app related question. Please try again. I am the Golo Merchant AI Assistant, specialized exclusively in guiding you through the Golo web application, product listings, orders, payments, KYC verification, and store settings. 😊",
                    source: "Scope Guardrail",
                    isError: true
                };
            }

            // Logout intent fast path
            if (qLower.includes('logout') || qLower.includes('log out') || qLower.includes('sign out') || qLower.includes('signout')) {
                const logoutFaq = ALL_GOLO_FAQS.find(f => f.id === 163);
                if (logoutFaq) {
                    return { answer: logoutFaq.answer, source: logoutFaq.category, isError: false };
                }
            }

            // Domain check
            const appTerms = [
                'golo', 'merchant', 'product', 'products', 'order', 'orders', 'payment', 'payout',
                'voucher', 'vouchers', 'deal', 'deals', 'offer', 'offers', 'wallet', 'credit note',
                'kyc', 'verification', 'store', 'shop', 'dashboard', 'delivery', 'pickup', 'refund',
                'cancellation', 'subscription', 'wishlist', 'loyalty', 'points', 'stars', 'nexaprime',
                'account', 'admin', 'coupon', 'help', 'support', 'logout', 'login', 'password', 'profile'
            ];
            const isRelevant = appTerms.some(term => qLower.includes(term));
            if (!isRelevant) {
                return {
                    answer: "It is not our app related question. Please try again. I am the Golo Merchant AI Assistant, specialized exclusively in guiding you through the Golo web application, product listings, orders, payments, KYC verification, and store settings. 😊",
                    source: "Scope Guardrail",
                    isError: true
                };
            }

            // Semantic scoring across 163 FAQs
            let best = null;
            let maxScore = 0;
            const words = qLower.replace(/[^\w\s]/g, '').split(/\s+/);

            for (let f of ALL_GOLO_FAQS) {
                let score = 0;
                const fqLower = f.question.toLowerCase();
                if (qLower.includes(fqLower)) score += 15;
                for (let tag of f.tags) {
                    if (words.includes(tag.toLowerCase())) score += 3;
                    if (qLower.includes(tag.toLowerCase())) score += 2;
                }
                if (score > maxScore) {
                    maxScore = score;
                    best = f;
                }
            }

            if (best && maxScore >= 2) {
                return { answer: best.answer, source: best.category, isError: false };
            }

            return {
                answer: "For this inquiry regarding the GOLO platform, please check your **Dashboard** settings or submit a ticket to **support@golo.com**. Our operations team will guide you step by step.",
                source: "GOLO Knowledge Base",
                isError: false
            };
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            initThemeSettings();
            initSpeechEngine();
            setRobotState('idle');

            // URL parameter handling for deep linking & state inspection
            const params = new URLSearchParams(window.location.search);
            if (params.get('theme')) {
                setThemeMode(params.get('theme'));
            }
            if (params.get('open') === 'true') {
                openAssistantModal();
            }
            if (params.get('state')) {
                const s = params.get('state');
                if (s === 'typing') {
                    setRobotState('typing', 'Typing question on keyboard...');
                    inputField.value = 'How do I log out of my GOLO account?';
                } else if (s === 'processing') {
                    setRobotState('processing', 'Thinking & processing...');
                } else if (s === 'happy' || s === 'success') {
                    setRobotState('happy', 'Guidance ready! 😊');
                } else if (s === 'error') {
                    setRobotState('error', 'Not app related');
                }
            }
        });
    </script>
